name: Deploy Fish Tenant

on:
  push:
    branches:
      - dev
      - test
      - main
    paths:
      - 'src/tenant/fish/**'
      - '!src/tenant/fish/rag/**'
      - '.github/workflows/deploy-tenant-reusable.yml'
      - '.github/workflows/deploy-fish.yml'

jobs:
  deploy-fish:
    uses: ./.github/workflows/deploy-tenant-reusable.yml
    secrets: inherit
    with:
      tenant: fish
      deployment_environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
